<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" role="img" aria-label="Fivecodelab Software — Genuine Microsoft Software Licenses">
  <defs>
    <linearGradient id="bg_g" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5F9FD"/>
      <stop offset="1" stop-color="#E6F0FA"/>
    </linearGradient>
    <linearGradient id="mark_g" x1="0" y1="0" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#0070BA"/>
      <stop offset=".55" stop-color="#003087"/>
      <stop offset="1"   stop-color="#012169"/>
    </linearGradient>
    <radialGradient id="mark_hl" cx=".25" cy=".15" r=".75">
      <stop offset="0" stop-color="rgba(255,255,255,.34)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <linearGradient id="og_y" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD46B"/>
      <stop offset="1" stop-color="#FFC439"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg_g)"/>
  <!-- Decorative blobs -->
  <circle cx="80"   cy="120" r="180" fill="rgba(0,112,186,.10)"/>
  <circle cx="1120" cy="540" r="220" fill="rgba(255,196,57,.16)"/>

  <!-- Centered brand mark -->
  <g transform="translate(120 200)">
    <rect x="0" y="0" width="220" height="220" rx="52" fill="url(#mark_g)"/>
    <rect x="0" y="0" width="220" height="220" rx="52" fill="url(#mark_hl)"/>
    <g transform="translate(40 24) scale(4.4)">
      <path d="M18 13.5 h12 a1.5 1.5 0 0 1 0 3 h-9.2 l-1 5.6 c1.3 -.9 2.9 -1.4 4.6 -1.4 c4.7 0 8.4 3.5 8.4 8.2 c0 4.7 -3.7 8.6 -8.6 8.6 c-3.6 0 -6.7 -2 -8.1 -5 a1.5 1.5 0 1 1 2.7 -1.3 c.9 1.9 2.9 3.3 5.4 3.3 c3.2 0 5.6 -2.6 5.6 -5.6 c0 -3 -2.4 -5.2 -5.4 -5.2 c-1.7 0 -3.2 .8 -4.1 1.9 a1.5 1.5 0 0 1 -2.6 -1.1 z" fill="#fff"/>
    </g>
    <circle cx="180" cy="170" r="16" fill="url(#og_y)"/>
    <circle cx="180" cy="170" r="16" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="2"/>
  </g>

  <!-- Wordmark + tagline -->
  <g font-family="Manrope, 'Helvetica Neue', Segoe UI, Arial, sans-serif" letter-spacing="-.02em">
    <text x="380" y="290" font-size="76" font-weight="800" fill="#003087">Fivecodelab</text>
    <text x="380" y="380" font-size="76" font-weight="800" fill="#0070BA">Software</text>
    <text x="380" y="430" font-size="22" letter-spacing=".22em" font-weight="700" fill="#6c7378">AUTHORIZED RESELLER</text>
    <text x="380" y="490" font-size="28" font-weight="600" fill="#2c2e2f">Genuine Microsoft licenses · Instant digital delivery</text>
  </g>

  <!-- Yellow PayPal-style CTA chip -->
  <g transform="translate(380 530)">
    <rect x="0" y="0" width="280" height="60" rx="30" fill="url(#og_y)" stroke="rgba(0,48,135,.12)"/>
    <text x="140" y="40" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#142C8E">Shop Now →</text>
  </g>
</svg>
