<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80" fill="none" role="img" aria-label="Fivecodelab Software">
  <defs>
    <linearGradient id="wm_g" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#0070BA"/>
      <stop offset=".55" stop-color="#003087"/>
      <stop offset="1"   stop-color="#012169"/>
    </linearGradient>
    <radialGradient id="wm_hl" cx=".25" cy=".15" r=".75">
      <stop offset="0" stop-color="rgba(255,255,255,.34)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <linearGradient id="wm_y" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD46B"/>
      <stop offset="1" stop-color="#FFC439"/>
    </linearGradient>
  </defs>

  <!-- Brand mark -->
  <g transform="translate(8 8)">
    <rect x="1.5" y="1.5" width="60" height="60" rx="14" fill="url(#wm_g)"/>
    <rect x="1.5" y="1.5" width="60" height="60" rx="14" fill="url(#wm_hl)"/>
    <!-- Stylized "5" — same path as the navbar mark, scaled -->
    <g transform="translate(0 0) scale(1.31)">
      <path d="M18 13.5 h12 a1.5 1.5 0 0 1 0 3 h-9.2 l-1 5.6 c1.3 -.9 2.9 -1.4 4.6 -1.4 c4.7 0 8.4 3.5 8.4 8.2 c0 4.7 -3.7 8.6 -8.6 8.6 c-3.6 0 -6.7 -2 -8.1 -5 a1.5 1.5 0 1 1 2.7 -1.3 c.9 1.9 2.9 3.3 5.4 3.3 c3.2 0 5.6 -2.6 5.6 -5.6 c0 -3 -2.4 -5.2 -5.4 -5.2 c-1.7 0 -3.2 .8 -4.1 1.9 a1.5 1.5 0 0 1 -2.6 -1.1 z" fill="#fff"/>
    </g>
    <!-- PayPal-yellow accent dot -->
    <circle cx="50" cy="47" r="4" fill="url(#wm_y)"/>
    <circle cx="50" cy="47" r="4" fill="none" stroke="rgba(255,255,255,.45)" stroke-width=".8"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Manrope, 'Helvetica Neue', Segoe UI, Arial, sans-serif" font-weight="800" letter-spacing="-.02em">
    <text x="86" y="46" font-size="28" fill="#003087">Fivecodelab</text>
    <text x="222" y="46" font-size="28" fill="#0070BA">Software</text>
    <text x="86" y="64" font-size="9" letter-spacing=".22em" font-weight="700" fill="#6c7378">AUTHORIZED RESELLER</text>
  </g>
</svg>
